[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-omni-api"
version = "1.0.1"
description = "Direct Discord API framework: sync/async REST, Gateway, Components V2, Interactions, OAuth2, Webhooks and typed models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "discord-omni-api contributors"}]
dependencies = [
  "requests>=2.31.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
  "aiohttp>=3.9.0",
  "PyNaCl>=1.5.0"
]

[project.urls]
Documentation = "https://docs.discord.com/developers/intro"

[tool.setuptools.packages.find]
where = ["."]
include = ["discord_omni*"]
